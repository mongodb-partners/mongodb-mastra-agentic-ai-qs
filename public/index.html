<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marshal: Fraud Investigation Console</title>
<link rel="icon" href="/favicon.svg">
<script>
// The kill switch and the theme must both be correct at FIRST PAINT: /app.js is a deferred module
// at the end of <body>, so anything it does happens after the browser has already painted. A
// presenter reaching for ?ui=classic would see a flash of the layout they are escaping, and every
// light-mode phone scanning the QR code would see a flash of the dark palette. app.js re-resolves
// both once it runs — applyUiMode() and initTheme() in public/app.js — this only moves the first
// paint to the right answer. Neither of those can replace this script; see the comment above
// applyUiMode() before touching either half.
//
// THE STATEMENT ORDER BELOW IS LOAD-BEARING, not stylistic. The data-ui setAttribute must precede
// the localStorage read, because localStorage is the throwing call here: it is unavailable in
// Safari private browsing, when third-party storage is blocked, and behind some kiosk policies. In
// that case the catch swallows the rest of the block, and everything BEFORE the throw has already
// been applied. Ordered as it is, a storage-blocked visitor still gets ?ui=classic honoured at first
// paint and merely loses the theme preference (falling back to the OS scheme once app.js runs);
// reversed, the presenter's kill switch would silently stop working on exactly the locked-down
// browser someone hands you at a conference. Keep the riskiest statement last. Same reason
// initTheme() in app.js wraps its own reads: see its try/catch.
try { var q = new URLSearchParams(location.search).get('ui');
  if (q === 'classic') document.documentElement.setAttribute('data-ui', 'classic');
  // Same order as initTheme(): an explicit stored choice wins, else follow the OS.
  var t = localStorage.getItem('marshal-theme')
    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<style>
  :root {
    --bg:#05080e; --panel:rgba(17,23,33,.7); --panel2:rgba(24,32,44,.8); --border:rgba(120,145,180,.16);
    --ink:#eaf0f7; --muted:#8a99b0; --dim:#7c899a;
    --accent:#00e08a; --warn:#f7b731; --crit:#ff637a; --info:#4aa8ff; --mongo:#00ed64;
    --bggrad:radial-gradient(1400px 900px at 75% -15%,#0b1a26,#05080e 60%);
    --shadow:rgba(255,255,255,.02); --shadow2:rgba(255,255,255,.04);
    --border-strong:rgba(180,200,225,.22); --shadow-drop:rgba(0,0,0,.5);
    --tint-approve:rgba(0,224,138,.16); --tint-reject:rgba(255,93,115,.16); --tint-warn:rgba(247,183,49,.18);
    --tint-info:rgba(74,168,255,.15); --tint-neutral:rgba(134,149,171,.14);
    --tint-approve-soft:rgba(0,224,138,.08); --tint-reject-soft:rgba(255,93,115,.08); --tint-warn-soft:rgba(247,183,49,.08);
    --tint-mongo-soft:rgba(0,237,100,.07); --tint-mongo:rgba(0,237,100,.13); --tint-mongo-glow:rgba(0,237,100,.22);
    --edge-approve:rgba(0,224,138,.4); --edge-reject:rgba(255,93,115,.4); --edge-warn:rgba(247,183,49,.4);
    --banner-info-bg:rgba(0,40,24,.92); --banner-alarm-bg:rgba(46,8,16,.94); --tour-scrim:rgba(3,6,12,.72);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  :root[data-theme="light"] {
    --bg:#f4f7fb; --panel:rgba(255,255,255,.86); --panel2:rgba(248,250,253,.95); --border:rgba(30,50,80,.14);
    --ink:#122032; --muted:#57687e; --dim:#5c6c81;
    --accent:#007350; --warn:#8a5a00; --crit:#c11a33; --info:#1257a8; --mongo:#00684a;
    --bggrad:radial-gradient(1400px 900px at 75% -15%,#e3edf7,#f4f7fb 60%);
    --shadow:rgba(20,40,70,.03); --shadow2:rgba(20,40,70,.06);
    --border-strong:rgba(30,50,80,.28); --shadow-drop:rgba(30,50,80,.22);
    --tint-approve:rgba(0,122,85,.08); --tint-reject:rgba(193,26,51,.08); --tint-warn:rgba(138,90,0,.08);
    --tint-info:rgba(18,87,168,.08); --tint-neutral:rgba(90,107,130,.08);
    --tint-approve-soft:rgba(0,122,85,.06); --tint-reject-soft:rgba(193,26,51,.06); --tint-warn-soft:rgba(138,90,0,.06);
    --tint-mongo-soft:rgba(0,104,74,.06); --tint-mongo:rgba(0,104,74,.1); --tint-mongo-glow:rgba(0,104,74,.18);
    --edge-approve:rgba(0,122,85,.45); --edge-reject:rgba(193,26,51,.45); --edge-warn:rgba(138,90,0,.45);
    --banner-info-bg:rgba(230,250,240,.97); --banner-alarm-bg:rgba(255,235,238,.97); --tour-scrim:rgba(180,200,225,.55);
  }
  * { box-sizing:border-box; } html,body { height:100%; }
  body { margin:0; background:var(--bggrad); color:var(--ink); font-family:var(--sans); overflow:hidden; transition:background .3s,color .3s; }
  .mono { font-family:var(--mono); }
  svg.ic { vertical-align:-3px; flex-shrink:0; }
  #hud { display:grid; grid-template-rows:58px 74px 1fr 40px; grid-template-columns:380px minmax(0,1fr) 400px;
         grid-template-areas:"top top top" "rail rail rail" "left center right" "bottom bottom bottom";
         height:100vh; max-width:2200px; margin:0 auto; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; backdrop-filter:blur(10px); overflow:hidden; }
  .panel > summary { list-style:none; cursor:default; }
  .panel > summary::-webkit-details-marker { display:none; }
  .panel h2, .panel > summary { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0; padding:13px 16px 9px; display:flex; justify-content:space-between; align-items:center; }
  .scroll { overflow-y:auto; height:calc(100% - 36px); padding:0 12px 14px; }
  .scroll::-webkit-scrollbar { width:8px; } .scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

  /* top bar */
  #top { grid-area:top; display:flex; align-items:center; gap:14px; padding:0 18px; }
  #lockup { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #lockup .divider { width:1px; height:22px; background:var(--border-strong); flex-shrink:0; }
  #brand { font-weight:800; letter-spacing:.16em; font-size:19px; display:flex; align-items:center; gap:9px; }
  #brand .dot { width:9px;height:9px;border-radius:50%;background:var(--mongo); box-shadow:0 0 10px var(--mongo); }
  .tag { font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); border:1px solid var(--border); padding:4px 10px; border-radius:999px; }
  #status { font-family:var(--mono); font-size:12px; color:var(--mongo); }
  #themeBtn { display:inline-flex; align-items:center; gap:6px; }
  #themeBtn .ticon { font-size:13px; line-height:1; }
  .btn { font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--border);
         background:var(--shadow2); color:var(--ink); padding:8px 14px; border-radius:9px; cursor:pointer; transition:.15s; }
  .btn:hover { border-color:var(--muted); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.launch { border-color:var(--mongo); color:var(--mongo); font-weight:600; display:inline-flex; align-items:center; gap:7px; }
  .btn.launch:hover { background:var(--tint-mongo); box-shadow:0 0 16px var(--tint-mongo-glow); }
  .btn:focus-visible, .case:focus-visible { outline:2px solid var(--info); outline-offset:2px; }

  /* capability rail */
  #rail { grid-area:rail; display:grid; grid-template-columns:repeat(8,1fr); gap:10px; padding:9px 14px; }
  .cap { border:1px solid var(--border); border-radius:11px; padding:0 11px; position:relative; overflow:hidden; background:var(--panel2); transition:.2s;
         display:grid; grid-template-columns:auto 1fr auto; grid-template-rows:auto auto; align-items:center; column-gap:8px; }
  .cap .ico { grid-row:1 / span 2; color:var(--muted); display:flex; }
  .cap .name { grid-column:2; align-self:end; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .cap .n { grid-column:3; grid-row:1 / span 2; font-family:var(--mono); font-size:20px; font-weight:700; color:var(--ink); line-height:1; }
  .cap .lbl2 { grid-column:2; align-self:start; font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .cap.active { border-color:var(--mongo); box-shadow:0 0 18px var(--tint-mongo-glow); }
  .cap.active .ico { color:var(--mongo); }
  .cap.active .n { color:var(--mongo); }
  .cap.pulse { animation:cappulse .7s ease; }
  @keyframes cappulse { 0%{background:var(--tint-mongo-glow)} 100%{background:var(--panel2)} }
  .cap { cursor:help; }
  .cap::after { content:attr(data-tip); position:absolute; left:50%; top:calc(100% + 9px); width:240px; z-index:60;
    transform:translateX(-50%) translateY(-4px); background:var(--panel2); color:var(--ink); border:1px solid var(--mongo);
    border-radius:9px; padding:9px 11px; font-family:var(--sans); font-size:11.5px; line-height:1.45; text-transform:none; letter-spacing:0;
    box-shadow:0 12px 30px var(--shadow-drop); opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; }
  .cap:hover { overflow:visible; }
  .cap:hover::after { opacity:1; transform:translateX(-50%) translateY(0); }

  /* case queue */
  #left { grid-area:left; } #center { grid-area:center; } #right { grid-area:right; }
  .case { border:1px solid var(--border); border-left:3px solid var(--dim); border-radius:11px; padding:11px 13px; margin:9px 0; cursor:pointer; transition:.15s; background:var(--shadow); }
  .case:hover { border-color:var(--muted); transform:translateX(2px); background:var(--shadow2); }
  .case.sel { border-color:var(--info); box-shadow:0 0 0 1px var(--info) inset; }
  .case.s-rejected,.case.s-escalated { border-left-color:var(--crit); }
  .case.s-pending { border-left-color:var(--warn); }
  .case.s-approved { border-left-color:var(--accent); }
  .case.s-held { border-left-color:var(--warn); box-shadow:0 0 14px var(--tint-warn); }
  .case.s-investigating { border-left-color:var(--info); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .amt { font-family:var(--mono); font-size:16px; font-weight:600; }
  .sub { color:var(--muted); font-size:12px; } .dim { color:var(--dim); }
  .pill { font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:999px; font-weight:600; }
  .pill.pending { background:var(--tint-neutral); color:var(--muted); }
  .pill.approved,.pill.approve { background:var(--tint-approve); color:var(--accent); }
  .pill.rejected,.pill.escalated,.pill.reject { background:var(--tint-reject); color:var(--crit); }
  .pill.escalate { background:var(--tint-warn); color:var(--warn); }
  .pill.held { background:var(--tint-warn); color:var(--warn); animation:heldpulse 1.6s ease-in-out infinite; }
  .pill.investigating { background:var(--tint-info); color:var(--info); }
  @keyframes heldpulse { 0%,100%{box-shadow:0 0 0 0 transparent} 50%{box-shadow:0 0 0 4px var(--tint-warn)} }

  /* center: welcome */
  #center .scroll { padding:0; }
  #welcome { min-height:100%; display:flex; flex-direction:column; gap:22px; color:var(--muted); padding:34px 40px; }
  #welcome .wtop { text-align:center; max-width:760px; margin:8px auto 0; }
  #welcome .big { font-size:30px; color:var(--ink); font-weight:800; letter-spacing:.01em; margin-bottom:12px; }
  #welcome .lead { line-height:1.6; font-size:14px; }
  .wflow { display:flex; align-items:stretch; gap:0; justify-content:center; flex-wrap:wrap; }
  .wflow .wstep { flex:1; min-width:120px; max-width:180px; text-align:center; padding:14px 12px; border:1px solid var(--border); border-radius:12px; background:var(--panel2); position:relative; }
  .wflow .wstep .wi { color:var(--muted); } .wflow .wstep .wn { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); margin-top:6px; }
  .wflow .wstep .wd { font-size:11px; color:var(--dim); margin-top:4px; line-height:1.4; }
  .wflow .warrow { display:flex; align-items:center; color:var(--dim); font-size:18px; padding:0 6px; }
  .wgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .wjob { display:flex; gap:11px; align-items:flex-start; border:1px solid var(--border); border-radius:12px; background:var(--shadow); padding:13px 15px; }
  .wjob .ji { color:var(--muted); flex:0 0 22px; padding-top:2px; } .wjob b { color:var(--ink); font-size:13px; } .wjob .jd { color:var(--muted); font-size:12px; line-height:1.45; margin-top:2px; }
  .wjob .jq { font-family:var(--mono); font-size:10px; color:var(--mongo); margin-top:4px; }

  /* center: investigation theater (runs live while the agent works) */
  #theater { display:none; padding:16px 20px; }
  #theater.show { display:block; }
  #tdone { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tchip { font-family:var(--mono); font-size:10.5px; border:1px solid var(--border); border-radius:999px; padding:5px 11px; cursor:pointer;
           color:var(--muted); display:inline-flex; gap:7px; align-items:center; background:var(--shadow); transition:.15s; animation:mount .3s ease; }
  .tchip:hover { border-color:var(--muted); }
  .tchip .o-approve { color:var(--accent); } .tchip .o-reject { color:var(--crit); } .tchip .o-escalate,.tchip .o-held { color:var(--warn); }
  #tcase { border:1px solid var(--border); border-radius:14px; background:var(--shadow); padding:18px 20px; }
  #tcase .thead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  #tcase .tamt { font-family:var(--mono); font-size:34px; font-weight:700; line-height:1.05; }
  #tcase .tsub { color:var(--muted); font-size:13px; margin-top:5px; }
  #tcase .tlane { font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  /* pipeline that fills as real events land */
  .tpipe { display:flex; gap:6px; margin:16px 0 6px; }
  .tpipe .tstep { flex:1; text-align:center; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
                  padding:7px 4px 6px; border-radius:8px; border:1px solid var(--border); color:var(--dim); position:relative; transition:.25s; }
  .tpipe .tstep.on { border-color:var(--mongo); color:var(--mongo); background:var(--tint-mongo-soft); }
  .tpipe .tstep.now { border-color:var(--mongo); color:var(--ink); background:var(--tint-mongo); box-shadow:0 0 14px var(--tint-mongo-glow); }
  .tpipe .tstep.now::after { content:''; position:absolute; inset:auto 8px 3px 8px; height:2px; border-radius:2px; background:var(--mongo); animation:sweep 1s ease-in-out infinite; }
  @keyframes sweep { 0%,100%{opacity:.35} 50%{opacity:1} }
  #tnow { font-size:13px; color:var(--ink); margin:10px 0 2px; min-height:20px; display:flex; gap:9px; align-items:baseline; }
  #tnow .ic { color:var(--mongo); } #tnow .d { color:var(--muted); font-size:12px; }
  /* Dual attribution: Mastra tool on the left, MongoDB operator on the right. The operator is
     mono + accent because it is the half of the claim the audience is meant to read. */
  #tnow .tattr { font-family:var(--mono); font-size:12px; color:var(--ink); display:inline-flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  #tnow .tattr .sep { color:var(--dim); }
  #tnow .tattr.bad { color:var(--crit); }
  /* Running tool-call count on the reason box. Absolute so it cannot change .tstep's height and
     re-trigger the flex-wrap alignment work the 2026-07-25 reflow settled. */
  .tpipe .tstep .tbadge { position:absolute; top:-6px; right:-4px; min-width:15px; height:15px; padding:0 3px;
                          border-radius:999px; background:var(--mongo); color:var(--bg);
                          font-family:var(--mono); font-size:9px; line-height:15px; text-align:center; }
  .tpipe .tstep.working { border-color:var(--mongo); color:var(--mongo); }
  #tevid { margin-top:10px; }
  #tevid .section { animation:mount .35s ease; }
  @keyframes mount { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  /* verdict stamp */
  .stamp { display:inline-block; font-family:var(--mono); font-weight:800; letter-spacing:.2em; text-transform:uppercase; font-size:22px;
           border:3px solid; border-radius:10px; padding:8px 18px; margin:14px 0 4px; transform:rotate(-4deg);
           animation:stampin .38s cubic-bezier(.2,1.6,.35,1); }
  .stamp.approve { color:var(--accent); border-color:var(--accent); background:var(--tint-approve-soft); }
  .stamp.reject { color:var(--crit); border-color:var(--crit); background:var(--tint-reject-soft); }
  .stamp.escalate,.stamp.held { color:var(--warn); border-color:var(--warn); background:var(--tint-warn-soft); }
  @keyframes stampin { 0%{transform:rotate(-4deg) scale(2.2); opacity:0} 60%{opacity:1} 100%{transform:rotate(-4deg) scale(1)} }

  /* case detail */
  #detail { padding:16px 18px; display:none; }
  #detail.show { display:block; }
  .dhead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; }
  .dhead .id { font-family:var(--mono); font-size:13px; color:var(--muted); }
  .dhead .amt { font-size:26px; }
  .flow { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .section { margin:16px 0; }
  .section > .lbl { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:8px; display:flex; align-items:center; gap:7px; }
  .chip2 { font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:6px; background:var(--tint-info); color:var(--info); }
  .pipe { display:flex; gap:6px; flex-wrap:wrap; }
  .pstep { font-family:var(--mono); font-size:10px; padding:5px 9px; border-radius:7px; border:1px solid var(--border); color:var(--muted); }
  .pstep.on { border-color:var(--mongo); color:var(--mongo); }
  .meter { height:9px; border-radius:6px; background:var(--border); overflow:hidden; }
  .meter > i { display:block; height:100%; border-radius:6px; transition:width .6s ease; }
  .mini { border:1px solid var(--border); border-radius:9px; padding:9px 11px; margin:6px 0; background:var(--shadow); font-size:12.5px; }
  .mini .row .pill { transform:scale(.92); }
  .policy { border-left:3px solid var(--warn); }
  .rationale { font-size:13px; color:var(--muted); line-height:1.6; border-left:3px solid var(--info); padding:2px 0 2px 12px; }

  /* threshold gauge (structuring cases — replaces a degenerate 1-node "network") */
  .gauge { margin:6px 0 2px; }
  .gauge .bar { position:relative; height:26px; border-radius:8px; background:var(--border); overflow:visible; }
  .gauge .fill { position:absolute; inset:0 auto 0 0; border-radius:8px 0 0 8px; background:linear-gradient(90deg, var(--accent), var(--warn)); }
  .gauge .limit { position:absolute; top:-7px; bottom:-7px; width:2px; background:var(--crit); }
  .gauge .limit::after { content:attr(data-lbl); position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:9.5px; color:var(--crit); white-space:nowrap; }
  .gauge .mark { position:absolute; top:2px; bottom:2px; width:3px; border-radius:2px; background:var(--ink); }
  .gauge .legend { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:22px; }
  .gauge .delta { color:var(--warn); font-weight:700; }

  /* verdict banner + actions */
  .verdict { border-radius:11px; padding:13px 15px; margin:12px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .verdict.escalate,.verdict.held { background:var(--tint-warn); border:1px solid var(--edge-warn); }
  .verdict.held { animation:heldglow 2s ease-in-out infinite; }
  @keyframes heldglow { 0%,100%{box-shadow:0 0 0 0 transparent} 50%{box-shadow:0 0 22px var(--edge-warn)} }
  .verdict.approve { background:var(--tint-approve); border:1px solid var(--edge-approve); }
  .verdict.reject { background:var(--tint-reject); border:1px solid var(--edge-reject); }
  .verdict .d { font-size:18px; font-weight:700; text-transform:capitalize; }
  .actions { display:flex; gap:10px; margin-top:6px; }
  .btn.approve { border-color:var(--accent); color:var(--accent); } .btn.approve:hover { background:var(--tint-approve); }
  .btn.reject { border-color:var(--crit); color:var(--crit); } .btn.reject:hover { background:var(--tint-reject); }

  /* ring graph */
  .ringsvg { width:100%; max-width:440px; height:230px; display:block; margin:0 auto; }
  .node circle { fill:var(--panel2); stroke:var(--crit); stroke-width:2; }
  .node text.nlabel { fill:var(--muted); font-family:var(--mono); font-size:11.5px; text-anchor:middle; }
  .edge { stroke:var(--crit); stroke-width:1.6; fill:none; marker-end:url(#arrow); opacity:.85; }
  .edge-amt { fill:var(--dim); font-family:var(--mono); font-size:9px; text-anchor:middle; }
  .ringsvg.animate .edge { stroke-dasharray:300; stroke-dashoffset:300; animation:drawedge .7s ease forwards; }
  @keyframes drawedge { to { stroke-dashoffset:0; } }
  .pulse-dot { fill:var(--crit); }

  /* feed */
  .feed-item { display:flex; gap:9px; padding:9px 4px; border-bottom:1px dashed var(--border); font-size:12px; }
  .feed-item .fico { color:var(--muted); width:18px; flex:0 0 18px; padding-top:1px; }
  .feed-item .fmain b { color:var(--ink); } .feed-item .t { color:var(--dim); font-family:var(--mono); font-size:9.5px; }
  .feed-item .fdet { color:var(--muted); font-size:11px; }
  .empty { color:var(--dim); font-size:12px; padding:16px 6px; }
  #feedMode { font-family:var(--mono); font-size:9px; letter-spacing:.1em; border:1px solid var(--border); border-radius:999px; padding:2px 8px; color:var(--dim); text-transform:uppercase; }

  /* bottom bar: the payoff readout — real counts + the eval scorecard */
  #bottom { grid-area:bottom; display:flex; align-items:center; gap:16px; padding:0 18px; font-family:var(--mono); font-size:12px; overflow:hidden; }
  /* Deliberately quieter than the surrounding numbers: this is attribution, not telemetry. The link
     inherits the dim colour and only picks up the accent on hover, so it reads as a credit rather
     than a call to action competing with Replay Investigation. */
  #credit { font-size:10.5px; letter-spacing:.02em; white-space:nowrap; }
  #credit a { color:inherit; text-decoration:none; border-bottom:1px solid var(--border); transition:color .2s,border-color .2s; }
  #credit a:hover, #credit a:focus-visible { color:var(--mongo); border-bottom-color:var(--mongo); }
  #live { display:flex; align-items:center; gap:8px; flex-shrink:0; } #live .dot { width:9px;height:9px;border-radius:50%;background:var(--crit); }
  #live.on .dot { background:var(--mongo); box-shadow:0 0 9px var(--mongo); }
  #stats { display:flex; gap:14px; align-items:center; white-space:nowrap; }
  #stats span { color:var(--dim); } #stats b { color:var(--ink); font-weight:600; }
  #stats .good { color:var(--accent); }
  #counters span { color:var(--dim); margin-right:15px; } #counters b { color:var(--ink); }

  /* stage banner (policy-updated-live / audit alarm) */
  #banner { position:fixed; top:76px; left:50%; transform:translateX(-50%) translateY(-8px); z-index:800; display:none;
            font-family:var(--mono); font-size:13px; letter-spacing:.08em; padding:13px 22px; border-radius:12px;
            border:1px solid; box-shadow:0 18px 50px var(--shadow-drop); opacity:0; transition:opacity .25s, transform .25s; max-width:70vw; }
  #banner.show { display:block; opacity:1; transform:translateX(-50%) translateY(0); }
  #banner.info { background:var(--banner-info-bg); border-color:var(--mongo); color:var(--mongo); }
  #banner.alarm { background:var(--banner-alarm-bg); border-color:var(--crit); color:var(--crit); animation:alarmpulse 1.2s ease-in-out infinite; }
  @keyframes alarmpulse { 0%,100%{box-shadow:0 18px 50px var(--shadow-drop)} 50%{box-shadow:0 0 34px var(--crit)} }

  /* guided walkthrough */
  #tourMask { position:fixed; inset:0; z-index:900; pointer-events:none; display:none; }
  #tourMask.on { display:block; }
  #tourHole { position:absolute; border-radius:14px; box-shadow:0 0 0 9999px var(--tour-scrim), 0 0 0 2px var(--mongo), 0 0 26px var(--tint-mongo-glow);
              transition:all .35s cubic-bezier(.4,0,.2,1); pointer-events:none; }
  /* z-index 901/902 (#tipSheet) are the top of THIS repo's stack, but not of the composited page:
     the public deployment injects an overlay feedback pill at z-index:9999, which on the phone tier
     lands inside the bottom sheet these two become and used to swallow the tap on #tourNext and on
     #tipSheet .close. That is fixed at the pill's end — public/feedback.js in the deployment repo
     yields (visibility:hidden) whenever it geometrically overlaps #tourCard or #tipSheet — rather
     than by raising these, because a number here cannot outrank an injected script that is free to
     pick a bigger one, and because a tour card over the whole viewport is the wrong trade for a
     persistent widget. Keep both ids stable: feedback.js selects them by name. */
  #tourCard { position:absolute; z-index:901; width:320px; background:var(--panel2); border:1px solid var(--mongo); border-radius:14px;
              padding:16px 18px; box-shadow:0 18px 50px var(--shadow-drop); pointer-events:auto; transition:all .35s cubic-bezier(.4,0,.2,1); }
  #tourCard .step { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--mongo); }
  #tourCard h3 { margin:6px 0 8px; font-size:17px; color:var(--ink); }
  #tourCard p { margin:0 0 14px; font-size:13px; line-height:1.55; color:var(--muted); max-height:150px; overflow-y:auto; }
  #tourCard .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #tourCard .dots { display:flex; gap:5px; } #tourCard .dots i { width:6px;height:6px;border-radius:50%;background:var(--border); }
  #tourCard .dots i.on { background:var(--mongo); }
  #tourCard .skip { position:absolute; top:12px; right:14px; color:var(--dim); font-size:11px; cursor:pointer; background:none; border:none; }

  /* Tap-to-reveal rail tip. .cap::after is a :hover tooltip, which never fires on touch, so the
     same copy also gets a dismissable sheet. */
  #tipSheet { position:fixed; z-index:902; left:10px; right:10px; bottom:10px; display:none;
              background:var(--panel2); border:1px solid var(--mongo); border-radius:16px;
              padding:16px 18px 14px; box-shadow:0 -10px 40px var(--shadow-drop); }
  #tipSheet.on { display:block; }
  #tipSheet h3 { margin:0 0 8px; font-size:15px; color:var(--ink); display:flex; align-items:center; gap:8px; }
  #tipSheet p { margin:0 0 12px; font-size:13px; line-height:1.55; color:var(--muted); }
  #tipSheet .close { display:block; width:100%; min-height:44px; }

  /* ── responsive tiers ──────────────────────────────────────────────────────────────────────
     THE BOUNDARIES 759 AND 1179 ARE DUPLICATED IN public/app.js ON PURPOSE — see PHONE_MQ and
     TABLET_MQ there, which drive the disclosure sync and the density resolver and carry the full
     rationale. There is no build step in this project, so nothing can generate both a media query
     and a matchMedia string from one definition, and computing these rules from JS would move the
     layout off the pre-paint path (the exact flash the head script above exists to prevent). Two
     homes, kept in sync by hand: CHANGE A NUMBER HERE AND CHANGE IT IN app.js TOO.

     Every rule below is scoped :root:not([data-ui="classic"]) so ?ui=classic and the >=1600px
     layout stay byte-identical to the ui-baseline-2026-07-25 tag; the overlay repo's
     scripts/ui-matrix.mjs asserts that against a checkout of the tag itself. */
  @media (max-width:1599px) and (min-width:1180px) {
    :root:not([data-ui="classic"]) #hud { grid-template-columns:340px minmax(0,1fr) 360px; }
  }
  /* The pipeline flow wraps everywhere the hero is narrower than ~890px, and flex wrapping made it
     ragged: each line divides its own free space, and the LAST line has one fewer `›` to pay for, so
     its boxes come out wider than the ones above — measured 148/148/158 at 390px, 133 vs 180 at
     1440px, and 122 vs 180 at 1600px, which is what reads as "GOVERN and DECIDE are misaligned". A
     line that happened to break after an arrow also left it dangling at the row's end. So below the
     width where all six fit on ONE row, lay the steps out on a grid: equal columns by construction,
     however the rows break, and the arrows stop being layout participants.

     The cutoff is 1800px, not the 1600px tier boundary. #wflow gets ~59% of the viewport, so six
     120px steps plus five arrows need ~1800px of viewport before they fit a single line — measured
     container widths: 690px at 1600, 790px at 1700, 890px at 1800 (first single row). Cutting at
     1600 left the 1600-1799 band on the flex path still ragged, which is the band the reported
     laptop screenshot came from. The stage contract is a 1920px contract (that is what
     ui-matrix.mjs pins and what the podium rehearsed on) and is untouched by a rule that stops at
     1799. */
  @media (max-width:1799px) {
    :root:not([data-ui="classic"]) .wflow { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px; align-items:stretch; }
    /* Uncapped, the two columns stretch to 380px each at 1599px and the boxes read as banners rather
       than pipeline steps. 620px caps them near 300px, the widest that still looks like a step.
       `align-self` rather than `margin-inline:auto`, because #welcome is a column flex container: on
       the cross axis a max-width'd item with auto margins shrink-to-fits (measured 385px instead of
       620px), while align-self:center caps AND centres it. */
    :root:not([data-ui="classic"]) .wflow { max-width:620px; width:100%; align-self:center; }
    :root:not([data-ui="classic"]) .wflow .wstep { max-width:none; }
    /* The arrows encoded "next step" in a single row. Once the flow is a wrapping grid that reading
       is gone — an arrow at the end of row 1 points at a box below-left, not to its right. Drop them
       rather than leave a decoration that now lies about the order; the steps stay numbered by
       reading order, which is what the tour walks. */
    :root:not([data-ui="classic"]) .wflow .warrow { display:none; }
  }
  @media (max-width:1179px) and (min-width:1024px) {
    /* 1024-1179 fits three across comfortably: 2x3 instead of 3x2 keeps the boxes from going squat. */
    :root:not([data-ui="classic"]) .wflow { grid-template-columns:repeat(3,minmax(0,1fr)); max-width:none; }
  }
  @media (max-width:1179px) and (min-width:760px) {
    :root:not([data-ui="classic"]) #hud { grid-template-columns:minmax(0,1fr) 320px;
      grid-template-rows:58px 74px auto minmax(0,1fr) 40px;
      grid-template-areas:"top top" "rail rail" "left right" "center right" "bottom bottom"; }
    :root:not([data-ui="classic"]) #left > summary { cursor:pointer; min-height:44px; padding:14px 16px; }
    :root:not([data-ui="classic"]) #left .scroll { height:auto; max-height:34vh; }
    /* The status bar is `nowrap; overflow:hidden` and #stats alone needs 633px of the 794px available
       here, so everything after it falls off the right edge and is clipped. This is not new — the LIVE
       Track B bundle (no #credit) already loses #auditChip at 820px: measured bar right edge 808,
       chip left 839, 108px of overflow. The phone tier fixed this by wrapping; the tablet tier never
       got the same treatment. Wrap it too and give the bar its natural height, so the audit chip and
       the credit are both actually on screen. */
    :root:not([data-ui="classic"]) #hud { grid-template-rows:58px 74px auto minmax(0,1fr) auto; }
    :root:not([data-ui="classic"]) #bottom { flex-wrap:wrap; overflow:visible; padding:8px 14px; gap:6px 14px; }
    :root:not([data-ui="classic"]) #stats { flex-wrap:wrap; white-space:normal; gap:6px 12px; }
  }
  @media (max-width:759px) {
    :root:not([data-ui="classic"]) body { overflow-y:auto; overflow-x:hidden; }
    /* The rail sits BELOW the hero here, unlike every other tier. It is 8 tiles on two rows (see the
       #rail rule), ~108px, and above the hero that stacked with the wrapped #top to push the console
       past the fold — measured at 375x667: hero top 251px against a 233px budget, and 302px at
       320x568. Moving it below buys that height back for the thing the QR audience came to see and
       costs nothing, because the page scrolls on this tier: the counters are one short scroll away
       rather than one invisible sideways swipe away. Order is the only change; the rail keeps its
       grid-area name. */
    :root:not([data-ui="classic"]) #hud { grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto minmax(60vh,auto) auto auto auto auto;
      grid-template-areas:"top" "center" "rail" "left" "right" "bottom";
      height:auto; min-height:100vh; min-height:100dvh; gap:10px; padding:10px; }
    :root:not([data-ui="classic"]) #center { min-height:60vh; min-height:60dvh; }
    /* top bar: wraps instead of overflowing; brand tagline and status drop out */
    :root:not([data-ui="classic"]) #top { flex-wrap:wrap; gap:7px; padding:8px 10px; }
    :root:not([data-ui="classic"]) #top .tag, :root:not([data-ui="classic"]) #status { display:none; }
    :root:not([data-ui="classic"]) #top > div[style*="flex:1"] { display:none; }
    :root:not([data-ui="classic"]) #brand { font-size:15px; letter-spacing:.07em; gap:6px; }
    :root:not([data-ui="classic"]) #lockup { gap:7px; }
    :root:not([data-ui="classic"]) #launchBtn { flex:1 0 100%; justify-content:center; }
    :root:not([data-ui="classic"]) #top .btn { min-height:44px; padding:10px 14px; }
    /* The Approve / Reject gate is the one tap target the whole interactive demo turns on.
       .btn is 32px by default, so it needs sizing here too — #top .btn above does not cover it. */
    :root:not([data-ui="classic"]) .actions .btn { min-height:44px; padding:12px 14px; flex:1; }
    /* .verdict is display:flex; justify-content:space-between, so on a 440px screen .actions is
       capped at 205px — flex:1 above then splits that into two 98px buttons, narrower than the
       102px "✓ Approve" needs, and the label breaks onto two lines. Let the banner wrap and give
       .actions the whole row, so flex:1 yields two equal 170px one-line thumb targets. */
    :root:not([data-ui="classic"]) .verdict { flex-wrap:wrap; }
    :root:not([data-ui="classic"]) .verdict .actions { flex:1 0 100%; }
    :root:not([data-ui="classic"]) #themeBtn { min-width:44px; justify-content:center; }
    :root:not([data-ui="classic"]) #themeBtn .tlbl { display:none; }
    /* icon-only utility buttons so the bar stays two rows even at 375px. title= keeps the label. */
    :root:not([data-ui="classic"]) #tourBtn, :root:not([data-ui="classic"]) #resetBtn { font-size:0; min-width:44px; }
    :root:not([data-ui="classic"]) #tourBtn::before { content:"?"; font-size:16px; }
    :root:not([data-ui="classic"]) #resetBtn::before { content:"\21ba"; font-size:16px; }
    /* rail: 8 tiles as a 4x2 grid, icon + count only.
       This was a horizontal snap strip, which put tiles 5-8 off the right edge — so half the
       counters were invisible unless you knew to swipe a strip that gives no visual hint it
       scrolls. Wrapping to two rows costs ~46px of height on a page that already scrolls, and buys
       all eight numbers on screen at once. minmax(0,1fr) not a min-width: at 320px the four
       columns are 69px each, so any min-width above that would reintroduce the overflow this
       fixes. No scroll-snap or -webkit-overflow-scrolling here — nothing scrolls anymore. */
    :root:not([data-ui="classic"]) #rail { display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
      gap:6px; padding:6px 10px; }
    :root:not([data-ui="classic"]) .cap { min-height:44px; padding:0 8px; cursor:pointer; }
    :root:not([data-ui="classic"]) .cap .name, :root:not([data-ui="classic"]) .cap .lbl2 { display:none; }
    :root:not([data-ui="classic"]) .cap::after { display:none; }
    /* the money moment gets BIGGER, not smaller */
    :root:not([data-ui="classic"]) #tcase .tamt { font-size:40px; }
    :root:not([data-ui="classic"]) #welcome { padding:20px 16px; gap:16px; }
    :root:not([data-ui="classic"]) #welcome .big { font-size:24px; }
    :root:not([data-ui="classic"]) #theater { padding:12px 12px; }
    :root:not([data-ui="classic"]) #tcase { padding:14px 13px; }
    :root:not([data-ui="classic"]) .tpipe { gap:4px; }
    :root:not([data-ui="classic"]) .tpipe .tstep { font-size:8.5px; padding:6px 2px 5px; letter-spacing:0; }
    :root:not([data-ui="classic"]) .stamp { font-size:18px; padding:7px 14px; }
    /* bottom bar: wrap the readout instead of clipping it to a sliver */
    :root:not([data-ui="classic"]) #bottom { flex-wrap:wrap; overflow:visible; padding:10px 12px; gap:8px 14px; }
    :root:not([data-ui="classic"]) #stats { flex-wrap:wrap; white-space:normal; gap:8px 12px; }
    :root:not([data-ui="classic"]) #bottom > div[style*="flex:1"] { display:none; }
    /* The spacer above is gone on this tier, so #credit would tuck in beside the audit chip and
       compete with it. Give it the full width instead: it is the last thing in the bar and the last
       thing on the page, which is exactly where a build credit belongs. */
    :root:not([data-ui="classic"]) #credit { flex:1 0 100%; text-align:center; padding-top:2px; }
    /* This tier is the only one where <body> scrolls (overflow-y:auto above); every other tier
       pins the page to 100vh and scrolls inside the panels. So on this tier the panels must stop
       being scrollers, or a gesture that starts inside one is swallowed by it instead of moving
       the page. Measured at 390x844 before this rule: the page had 459px to scroll, #center .scroll
       kept `overflow-y:auto; height:calc(100% - 36px)` from :76 and so had 36px of its own range —
       enough to latch the gesture, too little to move visibly — and a 4000px wheel over #center
       left window.scrollY at 0. The centre column is the hero and fills most of the phone screen,
       so that is most of the screen unable to scroll the page it sits on. .panel is
       overflow:hidden, hence the overflow:visible here: without it the released .scroll just
       clips instead. */
    :root:not([data-ui="classic"]) #center { overflow:visible; }
    :root:not([data-ui="classic"]) #center .scroll { overflow:visible; height:auto; }
    /* collapsible side panels: tap targets and no fixed-height scroll box */
    :root:not([data-ui="classic"]) #left > summary, :root:not([data-ui="classic"]) #right > summary {
      cursor:pointer; min-height:44px; padding:14px 16px; }
    /* Same trap, milder: these keep a max-height so a 50-row queue does not push the rest of the
       page miles down, but max-height with overflow-y:auto is still a nested scroller. They are
       collapsed <details> by default here, so the exposure is small — but once opened, a gesture
       inside them is swallowed the same way. overscroll-behavior:contain is not the fix (it stops
       scroll *chaining*, which is the opposite of what is wanted); letting them size to content is,
       and the page scroll then reaches everything. */
    :root:not([data-ui="classic"]) #left .scroll, :root:not([data-ui="classic"]) #right .scroll {
      height:auto; max-height:none; overflow:visible; }
    :root:not([data-ui="classic"]) #left, :root:not([data-ui="classic"]) #right { overflow:visible; }
    /* The spotlight does absolute pixel maths against getBoundingClientRect(); once the panels
       stack (and two collapse to a near-zero-height <details>), it lands off-screen or on
       nothing. On this tier the tour is a fixed bottom sheet instead — no geometry involved. */
    :root:not([data-ui="classic"]) #tourMask { display:none !important; }
    :root:not([data-ui="classic"]) #tourCard { position:fixed; left:10px !important; right:10px;
      top:auto !important; bottom:10px; width:auto; border-radius:16px; padding:16px 18px 14px;
      box-shadow:0 -10px 40px var(--shadow-drop); }
    :root:not([data-ui="classic"]) #tourCard.attop { top:10px !important; bottom:auto; }
    :root:not([data-ui="classic"]) #tourCard p { max-height:34vh; }
    :root:not([data-ui="classic"]) #tourCard .nav .btn { min-height:44px; padding:10px 16px; }
    :root:not([data-ui="classic"]) #tourCard .skip { min-height:32px; padding:0 4px; }
    /* #banner is position:fixed at top:76px, which clears the >=1600px baseline's single-row #top.
       On this tier #top wraps (measured 113px tall, bottom edge 123px, at 375-440px wide; 164px
       tall, bottom edge 174px, at 320px) so the fixed banner landed on top of #launchBtn — which
       #top makes a full-width row here — covering 48% of it at 390/440px and 58% at 320px, and
       taking the tap: elementFromPoint at the button's centre returned #banner. The banner is
       z-index:800 and #top is in normal flow, so the banner always wins. Offset it clear of the
       tallest wrapped #top (174px) plus this tier's 10px gap rhythm. top is the only declaration
       needed: left:50% already caps the shrink-to-fit width at 50vw here, well under max-width:70vw,
       and the alarm string's tallest wrap (178px at 320px wide) still ends 206px above the fold of
       the shortest phone viewport. Kept as an offset rather than position:sticky in flow because
       sticky needs a flex/order change on <body> that relayouts #hud (measured: the launch button's
       centre then hit page content, not the button).
       scripts/ui-matrix.mjs asserts #launchBtn is hit-testable with #banner.alarm.show rendered. */
    :root:not([data-ui="classic"]) #banner { top:184px; }
  }
  @media (max-width:479px) {
    :root:not([data-ui="classic"]) .edge-amt { display:none; }
    :root:not([data-ui="classic"]) .ringsvg { height:200px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="top" class="panel">
    <div id="lockup" aria-label="MongoDB and Mastra"></div>
    <div id="brand">MARSHAL <span class="dot"></span></div>
    <span class="tag">MongoDB Atlas + Mastra · Fraud Investigation</span>
    <span id="status"></span>
    <div style="flex:1"></div>
    <button class="btn" id="tourBtn" title="Guided tour">? Tour</button>
    <button class="btn" id="themeBtn" title="Toggle light / dark (L)" aria-keyshortcuts="l"><span class="ticon">☀</span><span class="tlbl">Light</span></button>
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn launch" id="launchBtn"></button>
  </div>

  <div id="rail" class="panel"></div>

  <details id="left" class="panel" open><summary><span>Case Queue</span><span id="qcount" class="dim"></span></summary><div class="scroll" id="queue"><div class="empty">loading…</div></div></details>

  <div id="center" class="panel"><div class="scroll">
    <div id="welcome">
      <div class="wtop">
        <div class="big">One cluster. Eight jobs.</div>
        <div class="lead" id="welcomeLead"></div>
      </div>
      <div class="wflow" id="wflow"></div>
      <div class="wgrid" id="wgrid"></div>
    </div>
    <div id="theater">
      <div id="tdone"></div>
      <div id="tcase"></div>
    </div>
    <div id="detail"></div>
  </div></div>

  <details id="right" class="panel" open><summary><span>Agent Operations Feed</span><span id="feedMode"></span></summary><div class="scroll" id="feed"></div></details>

  <div id="bottom" class="panel">
    <div id="live"><span class="dot"></span><span>MongoDB Atlas</span></div>
    <div id="stats"></div>
    <div id="counters"></div>
    <div style="flex:1"></div>
    <span id="auditChip" class="dim">audit ⋯</span>
    <!-- Build credit. After #auditChip and after the flex spacer, so it sits at the far right of the
         status bar and never competes with the live numbers for space; rel=noopener because
         target=_blank without it hands the opener to the new tab. -->
    <span id="credit" class="dim">Developed by <a href="https://www.linkedin.com/in/farooqimdd"
      target="_blank" rel="noopener noreferrer">Mohammad Daoud Farooqi</a></span>
  </div>
</div>
<div id="banner" role="status"></div>
<div id="tourMask"><div id="tourHole"></div></div>
<div id="tipSheet">
  <h3><span id="tipIcon"></span><span id="tipTitle"></span></h3>
  <p id="tipBody"></p>
  <button class="btn launch close" id="tipClose">Got it</button>
</div>
<div id="tourCard" style="display:none">
  <button class="skip" id="tourSkip">Skip ✕</button>
  <div class="step" id="tourStep"></div>
  <h3 id="tourTitle"></h3>
  <p id="tourBody"></p>
  <div class="nav">
    <button class="btn" id="tourPrev">‹ Prev</button>
    <div class="dots" id="tourDots"></div>
    <button class="btn launch" id="tourNext">Next ›</button>
  </div>
</div>
<script type="module" src="/app.js?v=17"></script>
</body>
</html>
